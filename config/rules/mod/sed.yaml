rules:
- id: api-type-adapter-construction
  description: Construct adapters through the public utilities facade.
  include: [ src/flext_api/typings.py ]
  distributions: [ flext-api ]
  find: '\bu\.TypeAdapter\('
  replace: 'u.type_adapter('
- id: api-tests-service-facade
  description: Publish the test service base from its own source module.
  include: [ tests/base.py ]
  distributions: [ flext-api ]
  find: '^__all__: list\[str\] = \["TestsFlextApiServiceBase"\]$'
  replace: |-
    s = TestsFlextApiServiceBase

    __all__: list[str] = ["TestsFlextApiServiceBase", "s"]
  flags: [ MULTILINE ]
- id: api-result-bool-keyword
  description: Name the public result payload at Boolean call sites.
  include:
  - src/flext_api/api.py
  - src/flext_api/services/base_client.py
  distributions: [ flext-api ]
  find: 'r\[bool\]\.ok\(True\)'
  replace: 'r[bool].ok(value=True)'
- id: api-http-contract-matcher-import
  description: Use the shared public test matcher for HTTP contracts.
  include: [ tests/unit/test_transports_facade_httpx.py ]
  distributions: [ flext-api ]
  find: '\A(?![\s\S]*^from tests import p, tm$)([\s\S]*?^from flext_api import \([\s\S]*?^\))'
  replace: |-
    \1
    from tests import p, tm
  flags: [ MULTILINE ]
- id: api-http-contract-matcher-import-order
  description: Keep the shared matcher after the package facade import block.
  include: [ tests/unit/test_transports_facade_httpx.py ]
  distributions: [ flext-api ]
  find: '^from tests import p, tm\n\n(from flext_api import \([\s\S]*?^\))|^(from flext_api import \([\s\S]*?^\))\n\nfrom flext_tests import tm'
  replace: |-
    \1\2
    from tests import p, tm
  flags: [ MULTILINE ]
- id: api-http-contract-unused-typing-import
  description: Remove the unused type-checking import from the public contract test.
  include: [ tests/unit/test_transports_facade_httpx.py ]
  distributions: [ flext-api ]
  find: 'from typing import TYPE_CHECKING\n\n|\nif TYPE_CHECKING:\n    from flext_core import t\n'
  replace: ''
- id: api-http-contract-identity-assertions
  description: Check public class identity through the shared matcher.
  include: [ tests/unit/test_transports_facade_httpx.py ]
  distributions: [ flext-api ]
  find: '^(\s*)assert (\w+) is ([\w.]+)$'
  replace: '\1tm.that(\2 is \3, eq=True)'
  flags: [ MULTILINE ]
- id: api-http-contract-instance-assertions
  description: Check the public status type through the shared matcher.
  include: [ tests/unit/test_transports_facade_httpx.py ]
  distributions: [ flext-api ]
  find: '^(\s*)assert isinstance\(conflict, int\)$'
  replace: '\1tm.that(type(conflict), eq=int)'
  flags: [ MULTILINE ]
- id: api-http-contract-instance-matcher
  description: Check the runtime type directly without a statically tautological predicate.
  include: [ tests/unit/test_transports_facade_httpx.py ]
  distributions: [ flext-api ]
  find: 'tm\.that\(isinstance\(conflict, int\), eq=True\)'
  replace: 'tm.that(type(conflict), eq=int)'
- id: api-http-contract-equality-assertions
  description: Compare public status values through the shared matcher.
  include: [ tests/unit/test_transports_facade_httpx.py ]
  distributions: [ flext-api ]
  find: '^(\s*)assert (\w+) == ([^\n]+)$'
  replace: '\1tm.that(\2, eq=\3)'
  flags: [ MULTILINE ]
- id: api-http-contract-open-client-assertion
  description: Check the open client state through the shared matcher.
  include: [ tests/unit/test_transports_facade_httpx.py ]
  distributions: [ flext-api ]
  find: '^            assert not client\.is_closed$'
  replace: '            tm.that(client.is_closed, eq=False)'
  flags: [ MULTILINE ]
- id: api-http-contract-closed-client-assertion
  description: Check the closed client state through the shared matcher.
  include: [ tests/unit/test_transports_facade_httpx.py ]
  distributions: [ flext-api ]
  find: '^        assert client\.is_closed$'
  replace: '        tm.that(client.is_closed, eq=True)'
  flags: [ MULTILINE ]
- id: api-protocol-transport-base-name
  description: Use the published protocol class without a local import alias.
  include: [ src/flext_api/_protocols/transports.py ]
  distributions: [ flext-api ]
  find: 'FlextApiProtocolsBase as pb'
  replace: 'FlextApiProtocolsBase'
- id: api-protocol-transport-base-reference
  description: Reference the public base class for the transport plugin port.
  include: [ src/flext_api/_protocols/transports.py ]
  distributions: [ flext-api ]
  find: 'pb\.TransportPlugin'
  replace: 'FlextApiProtocolsBase.TransportPlugin'
- id: api-tests-service-parent-class
  description: Extend the public parent service class instead of its letter alias.
  include: [ tests/base.py ]
  distributions: [ flext-api ]
  find: 'from flext_tests import s as tests_s'
  replace: 'from flext_tests import FlextTestsServiceBase'
- id: api-tests-service-parent-base
  description: Inherit the public parent service class directly.
  include: [ tests/base.py ]
  distributions: [ flext-api ]
  find: 'class TestsFlextApiServiceBase\(tests_s\):'
  replace: 'class TestsFlextApiServiceBase(FlextTestsServiceBase):'
